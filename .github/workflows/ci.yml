name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - if: matrix.python-version == '3.12'
        run: |
          python -m build --wheel
          python -m venv /tmp/decision-cabinet-wheel
          WHEEL_PATH=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          /tmp/decision-cabinet-wheel/bin/pip install "${WHEEL_PATH}[mcp]"
          cd /tmp
          /tmp/decision-cabinet-wheel/bin/python "${GITHUB_WORKSPACE}/scripts/smoke_mcp_install.py" \
            --command /tmp/decision-cabinet-wheel/bin/decision-cabinet-mcp

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Export privacy-safe public catalog
        run: python scripts/export_demo_data.py --output web/public/demo-data.json
      - name: Build static browser demo
        working-directory: web
        run: |
          npm ci
          npm run build:demo
